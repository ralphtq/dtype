name: Format

# Spotless formatting of the Markdown files, with QUDT's settings (pom.xml).
# DTYPE has no Turtle sources to format: its current schema is RDF/XML and
# the version folders are frozen.
#
# On every push and pull request: spotless:check, which fails if a file is
# not formatted.
# Run by hand with "apply" ticked: spotless:apply and a commit of the
# formatted files to the branch.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      apply:
        description: "Format the files and commit them to this branch"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Check formatting
        if: ${{ !inputs.apply }}
        run: mvn -B -ntp spotless:check

      - name: Apply formatting
        if: ${{ inputs.apply }}
        run: mvn -B -ntp spotless:apply

      - name: Commit the formatted files
        if: ${{ inputs.apply }}
        run: |
          if git diff --quiet; then
            echo "Already formatted; nothing to commit." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git commit -am "Apply Spotless formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git diff --stat HEAD~1 >> "$GITHUB_STEP_SUMMARY"
